name: Suggestion
description: An idea, a look that could be better, a setting you'd like. For anything broken, use Bug report.
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        **Is something broken, crashing or not working as it should?** Please go back and choose **Bug report** instead, even if you don't have logs. It asks the questions that help me fix it.
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
      description: What you would like, and why. Screenshots help, especially a comparison with how you expected it to look.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VS Path Tracing version, if it matters
      placeholder: "0.2.1"
